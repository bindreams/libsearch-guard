name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # setup-rust is still needed so the cargo-fmt / cargo-clippy hooks
      # inside prek can find a Rust toolchain.
      - uses: ./.github/actions/setup-rust
        with:
          pin-file: .github/release-toolchain
          components: rustfmt, clippy

      # Single source of truth for lint is prek.toml — the same checks run
      # locally as pre-commit hooks, shellcheck's optional checks included:
      # the actionlint hook carries them as its own `env`. prek-action runs
      # `prek run --all-files` with `--show-diff-on-failure --color=always`,
      # so fmt / mixed-line-ending failures surface as a diff in CI logs.
      # prek.toml's own `shellcheck-on-path` hook (not a step here) asserts
      # shellcheck is reachable, so that check runs identically in CI and
      # locally instead of living only in this file.
      - name: Derive pinned shellcheck version from prek.toml
        # actionlint's shellcheck (see prek.toml) is not the shellcheck-py
        # hook's own binary — it shells out to whatever `shellcheck` is on
        # PATH, so CI needs its own install. The version comes from the
        # `# frozen: <tag>` comment on prek.toml's shellcheck-py `rev`, so
        # there's one number to bump, not two to keep in step.
        id: shellcheck-pin
        run: |
          set -euo pipefail
          version=$(.github/scripts/prek-frozen-tag.sh prek.toml https://github.com/shellcheck-py/shellcheck-py --tool-version)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # actionlint's shellcheck integration silently degrades if the binary is
      # missing (see prek.toml) — install it explicitly and verify.
      - name: Install shellcheck
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: shellcheck@${{ steps.shellcheck-pin.outputs.version }}

      # .shellcheckrc's `enable=` line (and its copy as SHELLCHECK_OPTS in
      # prek.toml's actionlint hook) is the only thing turning on SC2249 and
      # SC2312. shellcheck silently no-ops on an unrecognized enable= name, so
      # a typo, or an upstream rename/removal of either check, would drop
      # coverage with this job staying green. Prove both still fire against a
      # fixture built to trip each of them.
      - name: Assert shellcheck's optional checks still fire
        shell: bash
        run: |
          set -euo pipefail
          fixture=$(mktemp)
          trap 'rm -f "$fixture"' EXIT
          cat <<'SH' > "$fixture"
          #!/bin/sh
          case "$1" in
            x) echo x ;;
          esac
          if [ "$(false)" ]; then echo hi; fi
          SH
          out=$(shellcheck --enable=add-default-case,check-extra-masked-returns "$fixture" 2>&1) && rc=0 || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::shellcheck did not flag a fixture built to trip SC2249 and SC2312 -- the optional checks may have stopped being recognized"
            exit 1
          fi
          for code in SC2249 SC2312; do
            if ! grep -q "$code" <<<"$out"; then
              echo "::error::Expected $code in shellcheck's output but it was missing:"
              echo "$out"
              exit 1
            fi
          done

      # Release-script tests run against a stubbed `gh`; no network, no repo
      # state.
      - name: Test release scripts
        run: |
          .github/scripts/tests/verify-sole-release.test.sh
          .github/scripts/tests/release-toolchain.test.sh
          .github/scripts/tests/prek-frozen-tag.test.sh
          .github/scripts/tests/check-toolchain.test.sh
          .github/scripts/tests/require-target-on-main.test.sh

      - uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1
        with:
          prek-version: 0.5.9

  test:
    name: Test (${{ matrix.os }}/${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: darwin
            arch: arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - os: windows
            arch: amd64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows
            arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-rust
        with:
          pin-file: .github/release-toolchain
          # The Windows targets too: a unit test compiles the pre-`main` initializer for each architecture it
          # traps on.
          targets: ${{ matrix.target }},x86_64-pc-windows-msvc,i686-pc-windows-msvc,aarch64-pc-windows-msvc,arm64ec-pc-windows-msvc

      - name: Build workspace
        run: cargo build --workspace --target ${{ matrix.target }}

      # The tests build their fixture packages with a nested `cargo build`, so
      # the runner needs the same network and toolchain as the build above.
      - name: Tests
        run: cargo test --workspace --target ${{ matrix.target }}

  # `bins()` cannot harden a GNU target (`windows-gnu`, `windows-gnullvm`): it must fail the link of every `[[bin]]`
  # and nothing else. The job goes red if it panics or stops failing.
  unsupported-targets:
    name: Unsupported target (${{ matrix.target }} on ${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-pc-windows-gnu
          - runner: ubuntu-latest
            target: x86_64-pc-windows-gnullvm
          - runner: windows-latest
            target: x86_64-pc-windows-gnu

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/setup-rust
        with:
          pin-file: .github/release-toolchain
          targets: ${{ matrix.target }}

      # windows-latest ships MinGW.
      - name: Install MinGW-w64 (GNU, Linux)
        if: matrix.runner == 'ubuntu-latest' && matrix.target == 'x86_64-pc-windows-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64

      - name: Install llvm-mingw (gnullvm, Linux)
        if: matrix.target == 'x86_64-pc-windows-gnullvm'
        run: |
          set -euo pipefail
          url=https://github.com/mstorsjo/llvm-mingw/releases/download/20261104/llvm-mingw-20261104-ucrt-ubuntu-22.04-x86_64.tar.xz
          curl -fsSL -o "$RUNNER_TEMP/llvm-mingw.tar.xz" "$url"
          echo "919380403de87dca3c581c2053230cd298af5e891286628ba0613b7fed370926  $RUNNER_TEMP/llvm-mingw.tar.xz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/llvm-mingw"
          tar -xJf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
          echo "$RUNNER_TEMP/llvm-mingw/bin" >> "$GITHUB_PATH"

      - name: Bins fail to link, the library builds
        shell: bash
        run: .github/scripts/unsupported-target.sh ${{ matrix.target }}
